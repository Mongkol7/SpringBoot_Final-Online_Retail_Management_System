# ===================================================================
# Spring Boot Online Retail Management System — Example YAML Configuration
# Copy this file to application.yml and customize values as needed.
# ===================================================================

server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: online-retail-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/springboot_final_onlineretailmanagement_db
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
